name: Release - Build & Distribute

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Tag de la versión (ej. v1.2.0, dejar vacío si ya se ejecutó con git tag)'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  release:
    name: Build Installer & Create Release
    runs-on: windows-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.14
        uses: actions/setup-python@v5
        with:
          python-version: '3.14'
          cache: 'pip'

      - name: Install Inno Setup via Chocolatey
        run: choco install innosetup -y

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install nuitka zstandard

      - name: Compile Executable with Nuitka
        run: python scripts/build_nuitka.py

      - name: Compile Inno Setup Installer
        run: iscc.exe installer.iss

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            installer/Instalador_HybridOnCloud.exe
            widget.exe
          tag_name: ${{ github.event.inputs.tag_name || github.ref_name }}
          generate_release_notes: true
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
